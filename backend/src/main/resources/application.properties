spring.application.name=pokedex
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}
spring.data.mongodb.auto-index-creation=true
server.port=${PORT:8080}
pokedex.seed.enabled=${SEED_ENABLED:true}
pokedex.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.error.include-message=never
